name: Publish Release Firmware

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. 2026.10.0)"
        required: true
        default: "2026.10.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-firmware:
    name: Build Firmware
    uses: esphome/workflows/.github/workflows/build.yml@2026.10.2
    with:
      files: |
        voice-assistant.factory.yaml
        voice-assistant-display.factory.yaml
      esphome-version: 2026.10.0
      release-summary: ${{ github.event_name == 'release' && github.event.release.body || '' }}
      release-url: ${{ github.event_name == 'release' && github.event.release.html_url || '' }}
      release-version: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}

  upload-to-release:
    name: Upload to Release
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@2026.10.2
    needs:
      - build-firmware
    with:
      version: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}

  deploy-pages:
    name: Deploy GitHub Pages
    needs: upload-to-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download all releases and manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/dev

          # Download latest stable release into root
          gh release download "${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.json" \
            --pattern "*.bin" \
            --dir public || true

          # Download dev release into /dev/
          gh release download dev \
            --repo "${{ github.repository }}" \
            --pattern "*.json" \
            --pattern "*.bin" \
            --dir public/dev || true

      - name: Create index.html
        run: |
          REPO_OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          BASE_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}"

          cat > public/index.html << 'HEADER'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Voice Assistant Firmware</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; max-width: 900px; }
              h1 { color: #333; }
              h2 { color: #555; margin-top: 30px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
              h3 { color: #666; margin-top: 20px; }
              ul { list-style-type: none; padding: 0; }
              li { margin: 8px 0; }
              a { color: #0366d6; text-decoration: none; }
              a:hover { text-decoration: underline; }
              code { font-family: monospace; font-size: 0.85em; background: #f6f8fa; padding: 2px 6px; border-radius: 3px; }
              .latest { background: #28a745; color: white; padding: 2px 8px; border-radius: 3px; font-size: 0.8em; margin-left: 10px; }
              .manifest-section { background: #f8f9fa; padding: 15px; border-radius: 5px; margin-bottom: 30px; }
            </style>
            <script
              type="module"
              src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"
            ></script>
          </head>
          <body>
            <h1>Voice Assistant Firmware</h1>
            <p>Pre-built Voice Assistant firmware binaries for ESPHome.</p>

            <div class="manifest-section">
              <h3>Production Firmware</h3>
              <ul>
          HEADER

          for manifest in public/*.json; do
            if [ -f "$manifest" ]; then
              filename=$(basename "$manifest")
              target="${filename%.manifest.json}"
              echo "        <li><esp-web-install-button manifest=\"${filename}\"></esp-web-install-button> <a href=\"${filename}\">${target}</a> - <code>${BASE_URL}/${filename}</code></li>" >> public/index.html
            fi
          done

          cat >> public/index.html << 'SECTION_DEV'
              </ul>
            </div>

            <div class="manifest-section">
              <h3>Development Firmware</h3>
              <ul>
          SECTION_DEV

          for manifest in public/dev/*.json; do
            if [ -f "$manifest" ]; then
              filename=$(basename "$manifest")
              target="${filename%.manifest.json}"
              echo "        <li><esp-web-install-button manifest=\"dev/${filename}\"></esp-web-install-button> <a href=\"dev/${filename}\">${target}</a> - <code>${BASE_URL}/dev/${filename}</code></li>" >> public/index.html
            fi
          done

          cat >> public/index.html << 'FOOTER'
              </ul>
            </div>

          </body>
          </html>
          FOOTER

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
