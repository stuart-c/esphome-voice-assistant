name: Publish Release Firmware

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. 2026.10.0)"
        required: true
        default: "2026.10.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-firmware:
    name: Build Firmware
    uses: esphome/workflows/.github/workflows/build.yml@2026.10.2
    with:
      files: |
        voice-assistant.factory.yaml
        voice-assistant-display.factory.yaml
      esphome-version: 2026.10.0
      release-summary: ${{ github.event_name == 'release' && github.event.release.body || '' }}
      release-url: ${{ github.event_name == 'release' && github.event.release.html_url || '' }}
      release-version: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}

  upload-to-release:
    name: Upload to Release
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@2026.10.3
    needs:
      - build-firmware
    with:
      version: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}

